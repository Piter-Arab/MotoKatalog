version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: motokatalog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moto_user
      POSTGRES_PASSWORD: moto_password
      POSTGRES_DB: motokatalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: